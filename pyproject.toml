[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akstack"
version = "2.2.0"
description = "Production-grade multi-agent orchestration for full-stack builds"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Akram" }]

[tool.setuptools]
include-package-data = true

[project.scripts]
akstack = "orchestrator.cli:main"

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[tool.setuptools.data-files]
"share/akstack/templates" = ["templates/*.md", "templates/*.yaml", "templates/*.yml", "templates/*.ts"]
"share/akstack/agents" = ["agents/*.md"]
"share/akstack/phases" = ["phases/*.md"]

[tool.unittest]
# run: python -m unittest discover -s tests -v
