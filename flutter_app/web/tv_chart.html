<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AK Forex — TradingView Lightweight Charts</title>
  <script src="lightweight-charts.standalone.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: rgb(11, 15, 25);
      color: rgb(148, 163, 184);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      overflow: hidden;
    }
    #app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Top Control Bar */
    #toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 12px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }
    .tool-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: rgb(148, 163, 184);
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: rgb(248, 250, 252);
      border-color: rgba(255, 255, 255, 0.16);
    }
    .btn.active {
      background: rgba(0, 229, 255, 0.15);
      border-color: rgb(0, 229, 255);
      color: rgb(0, 229, 255);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.25);
    }
    .btn-pair.active {
      background: rgba(41, 98, 255, 0.22);
      border-color: rgb(41, 98, 255);
      color: rgb(96, 165, 250);
      box-shadow: 0 0 10px rgba(41, 98, 255, 0.25);
    }
    .btn-pill {
      font-size: 10px;
      padding: 3px 7px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      font-family: 'Consolas', 'Courier New', monospace;
    }
    .badge-bid {
      background: rgba(0, 230, 118, 0.12);
      border: 1px solid rgba(0, 230, 118, 0.35);
      color: rgb(0, 230, 118);
    }
    .badge-rr {
      background: rgba(179, 136, 255, 0.15);
      border: 1px solid rgba(179, 136, 255, 0.35);
      color: rgb(179, 136, 255);
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgb(0, 230, 118);
      box-shadow: 0 0 8px rgb(0, 230, 118);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Chart Canvas Area */
    #chart-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }
    #tv-chart {
      width: 100%;
      height: 100%;
    }

    /* OHLC Floating Legend */
    #legend {
      position: absolute;
      top: 10px;
      left: 14px;
      z-index: 5;
      font-size: 11px;
      color: rgb(100, 116, 139);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      font-family: 'Consolas', monospace;
    }
    .legend-sym {
      font-weight: 800;
      font-size: 12px;
      color: rgb(248, 250, 252);
    }
    .legend-val {
      color: rgb(203, 213, 225);
      font-weight: 600;
    }
    .legend-up {
      color: rgb(0, 230, 118);
    }
    .legend-down {
      color: rgb(255, 82, 82);
    }

    /* Watermark */
    #watermark {
      position: absolute;
      right: 60px;
      bottom: 40px;
      font-size: 42px;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.025);
      letter-spacing: 2px;
      pointer-events: none;
      z-index: 1;
      text-transform: uppercase;
    }

    /* Loading overlay */
    #loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 15, 25, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 20;
      transition: opacity 0.25s ease;
      pointer-events: none;
      opacity: 0;
    }
    #loading-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(0, 229, 255, 0.2);
      border-top-color: rgb(0, 229, 255);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app-container">
    <!-- Top Interactive Toolbar -->
    <div id="toolbar">
      <!-- 1. Dedicated Forex Pair Switcher -->
      <div class="tool-group">
        <button id="btn-eurusd" class="btn btn-pair active" onclick="switchSymbol('EURUSDm')">
          <span>💶</span> EUR / USD
        </button>
        <button id="btn-usdcad" class="btn btn-pair" onclick="switchSymbol('USDCADm')">
          <span>💵</span> USD / CAD
        </button>
      </div>

      <!-- 2. Timeframe Selector (M1, M5, M15, H1, H4, D1) -->
      <div class="tool-group">
        <button id="tf-1m" class="btn" onclick="switchTf('M1')">1m</button>
        <button id="tf-5m" class="btn active" onclick="switchTf('M5')">5m</button>
        <button id="tf-15m" class="btn" onclick="switchTf('M15')">15m</button>
        <button id="tf-1h" class="btn" onclick="switchTf('H1')">1h</button>
        <button id="tf-4h" class="btn" onclick="switchTf('H4')">4h</button>
      </div>

      <!-- 3. Chart Type Switcher -->
      <div class="tool-group">
        <button id="type-candles" class="btn active" onclick="switchChartType('Candles')">Candles</button>
        <button id="type-bars" class="btn" onclick="switchChartType('Bars')">Bars</button>
        <button id="type-line" class="btn" onclick="switchChartType('Line')">Line</button>
        <button id="type-area" class="btn" onclick="switchChartType('Area')">Area</button>
      </div>

      <!-- 4. Technical Indicators Toggle -->
      <div class="tool-group">
        <button id="toggle-sma" class="btn btn-pill active" onclick="toggleSMA()">SMA 20</button>
        <button id="toggle-ema" class="btn btn-pill active" onclick="toggleEMA()">EMA 50</button>
        <button id="toggle-vol" class="btn btn-pill active" onclick="toggleVolume()">VOL</button>
      </div>

      <!-- 5. Color Palette Theme -->
      <div class="tool-group">
        <select id="theme-select" class="btn" onchange="switchTheme(this.value)" style="outline: none;">
          <option value="classic">Classic Forex (Green/Red)</option>
          <option value="cyber">Cyber Neon (Cyan/Sunset)</option>
          <option value="monokai">Monokai Gold (Gold/Purple)</option>
        </select>
      </div>

      <!-- 6. Live Price & Strategy Badges -->
      <div class="tool-group">
        <div class="badge badge-bid">
          <span class="pulse-dot"></span>
          <span>LIVE BID: </span>
          <span id="live-bid-val">1.13737</span>
          <span id="live-spread-val" style="color: rgb(100, 116, 139); font-size: 9px; margin-left: 3px;">(0.8p)</span>
        </div>
        <div class="badge badge-rr">
          <span>⚡ 1:5 R:R Institutional</span>
        </div>
      </div>
    </div>

    <!-- Chart Canvas & Overlay -->
    <div id="chart-wrapper">
      <div id="tv-chart"></div>
      <div id="watermark">EURUSD • M5</div>

      <!-- Floating Legend Header -->
      <div id="legend">
        <span class="legend-sym" id="leg-sym">EURUSDm M5</span>
        <span>O: <span class="legend-val" id="leg-o">-</span></span>
        <span>H: <span class="legend-val" id="leg-h">-</span></span>
        <span>L: <span class="legend-val" id="leg-l">-</span></span>
        <span>C: <span class="legend-val" id="leg-c">-</span></span>
        <span>V: <span class="legend-val" id="leg-v">-</span></span>
        <span id="leg-chg" class="legend-val">-</span>
      </div>

      <!-- Spinner Overlay -->
      <div id="loading-overlay">
        <div class="spinner"></div>
        <div style="font-size: 12px; color: rgb(0, 229, 255); font-weight: 600;">Streaming Exness MT4 Feed...</div>
      </div>
    </div>
  </div>

  <script>
    // ── AK Forex TradingView Lightweight Charts Engine ────────────────────────
    let chart = null;
    let mainSeries = null;
    let volumeSeries = null;
    let smaSeries = null;
    let emaSeries = null;

    let currentSymbol = 'EURUSDm';
    let currentTimeframe = 'M5';
    let currentChartType = 'Candles';
    let currentTheme = 'classic';

    let showSMA = true;
    let showEMA = true;
    let showVolume = true;

    let activePriceLines = [];
    let lastCandle = null;
    let historicalCandles = [];
    let ws = null;
    let pollInterval = null;

    // Theme Palettes
    const themes = {
      classic: {
        upColor: 'rgb(0, 230, 118)',
        downColor: 'rgb(255, 82, 82)',
        borderUpColor: 'rgb(0, 230, 118)',
        borderDownColor: 'rgb(255, 82, 82)',
        wickUpColor: 'rgb(0, 230, 118)',
        wickDownColor: 'rgb(255, 82, 82)',
        lineColor: 'rgb(0, 229, 255)',
        areaTop: 'rgba(0, 229, 255, 0.4)',
        areaBottom: 'rgba(0, 229, 255, 0.0)',
      },
      cyber: {
        upColor: 'rgb(0, 229, 255)',
        downColor: 'rgb(255, 61, 0)',
        borderUpColor: 'rgb(0, 229, 255)',
        borderDownColor: 'rgb(255, 61, 0)',
        wickUpColor: 'rgb(0, 229, 255)',
        wickDownColor: 'rgb(255, 61, 0)',
        lineColor: 'rgb(0, 229, 255)',
        areaTop: 'rgba(0, 229, 255, 0.45)',
        areaBottom: 'rgba(255, 61, 0, 0.0)',
      },
      monokai: {
        upColor: 'rgb(255, 215, 0)',
        downColor: 'rgb(224, 64, 251)',
        borderUpColor: 'rgb(255, 215, 0)',
        borderDownColor: 'rgb(224, 64, 251)',
        wickUpColor: 'rgb(255, 215, 0)',
        wickDownColor: 'rgb(224, 64, 251)',
        lineColor: 'rgb(255, 215, 0)',
        areaTop: 'rgba(255, 215, 0, 0.4)',
        areaBottom: 'rgba(224, 64, 251, 0.0)',
      }
    };

    // ── Initialization ────────────────────────────────────────────────────────
    function initChart() {
      const container = document.getElementById('tv-chart');
      container.innerHTML = '';

      const chartOptions = {
        layout: {
          background: { type: 'solid', color: 'rgb(11, 15, 25)' },
          textColor: 'rgb(148, 163, 184)',
          fontFamily: "'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif",
          fontSize: 11,
        },
        grid: {
          vertLines: { color: 'rgba(255, 255, 255, 0.04)' },
          horzLines: { color: 'rgba(255, 255, 255, 0.04)' },
        },
        crosshair: {
          mode: LightweightCharts.CrosshairMode ? LightweightCharts.CrosshairMode.Normal : 0,
          vertLine: {
            color: 'rgba(0, 229, 255, 0.4)',
            width: 1,
            style: 3, // dashed
            labelBackgroundColor: 'rgb(0, 229, 255)',
          },
          horzLine: {
            color: 'rgba(0, 229, 255, 0.4)',
            width: 1,
            style: 3,
            labelBackgroundColor: 'rgb(0, 229, 255)',
          },
        },
        rightPriceScale: {
          borderColor: 'rgba(255, 255, 255, 0.08)',
          scaleMargins: {
            top: 0.08,
            bottom: 0.22, // Space for volume histogram
          },
        },
        timeScale: {
          borderColor: 'rgba(255, 255, 255, 0.08)',
          timeVisible: true,
          secondsVisible: false,
        },
        handleScroll: {
          mouseWheel: true,
          pressedMouseMove: true,
          horzTouchDrag: true,
          vertTouchDrag: true,
        },
        handleScale: {
          axisPressedMouseMove: true,
          mouseWheel: true,
          pinch: true,
        },
      };

      chart = LightweightCharts.createChart(container, chartOptions);

      // Volume Series (Bottom Scale)
      const volSeriesOptions = {
        color: 'rgb(38, 166, 154)',
        priceFormat: { type: 'volume' },
        priceScaleId: 'volume-scale',
      };
      
      if (LightweightCharts.HistogramSeries) {
        volumeSeries = chart.addSeries(LightweightCharts.HistogramSeries, volSeriesOptions);
      } else if (chart.addHistogramSeries) {
        volumeSeries = chart.addHistogramSeries(volSeriesOptions);
      }

      if (volumeSeries) {
        chart.priceScale('volume-scale').applyOptions({
          scaleMargins: {
            top: 0.8,
            bottom: 0,
          },
        });
      }

      // SMA 20 (Gold)
      const smaOptions = {
        color: 'rgb(255, 179, 0)',
        lineWidth: 1.5,
        title: 'SMA 20',
        crosshairMarkerVisible: false,
      };
      if (LightweightCharts.LineSeries) {
        smaSeries = chart.addSeries(LightweightCharts.LineSeries, smaOptions);
      } else if (chart.addLineSeries) {
        smaSeries = chart.addLineSeries(smaOptions);
      }

      // EMA 50 (Purple)
      const emaOptions = {
        color: 'rgb(179, 136, 255)',
        lineWidth: 1.5,
        title: 'EMA 50',
        crosshairMarkerVisible: false,
      };
      if (LightweightCharts.LineSeries) {
        emaSeries = chart.addSeries(LightweightCharts.LineSeries, emaOptions);
      } else if (chart.addLineSeries) {
        emaSeries = chart.addLineSeries(emaOptions);
      }

      // Create Main Price Series according to selected chart type
      createMainSeries();

      // Crosshair / Legend update listener
      chart.subscribeCrosshairMove(param => {
        if (!param || !param.time || !param.seriesData || !mainSeries) {
          updateLegend(lastCandle);
          return;
        }
        const data = param.seriesData.get(mainSeries);
        if (data) {
          updateLegend(data);
        }
      });

      // Auto-resize on container dimension change
      const resizeObserver = new ResizeObserver(entries => {
        if (!entries || entries.length === 0 || !chart) return;
        const rect = entries[0].contentRect;
        chart.applyOptions({ width: rect.width, height: rect.height });
      });
      resizeObserver.observe(container);
    }

    // ── Create or Switch Price Series ─────────────────────────────────────────
    function createMainSeries() {
      if (mainSeries && chart) {
        chart.removeSeries(mainSeries);
        mainSeries = null;
      }
      activePriceLines = [];

      const p = themes[currentTheme];
      const digits = currentSymbol.includes('CAD') ? 5 : 5;

      const priceFormat = {
        type: 'price',
        precision: digits,
        minMove: 0.00001,
      };

      if (currentChartType === 'Candles') {
        const options = {
          upColor: p.upColor,
          downColor: p.downColor,
          borderUpColor: p.borderUpColor,
          borderDownColor: p.borderDownColor,
          wickUpColor: p.wickUpColor,
          wickDownColor: p.wickDownColor,
          priceFormat: priceFormat,
        };
        if (LightweightCharts.CandlestickSeries) {
          mainSeries = chart.addSeries(LightweightCharts.CandlestickSeries, options);
        } else if (chart.addCandlestickSeries) {
          mainSeries = chart.addCandlestickSeries(options);
        }
      } else if (currentChartType === 'Bars') {
        const options = {
          upColor: p.upColor,
          downColor: p.downColor,
          priceFormat: priceFormat,
        };
        if (LightweightCharts.BarSeries) {
          mainSeries = chart.addSeries(LightweightCharts.BarSeries, options);
        } else if (chart.addBarSeries) {
          mainSeries = chart.addBarSeries(options);
        }
      } else if (currentChartType === 'Line') {
        const options = {
          color: p.lineColor,
          lineWidth: 2,
          priceFormat: priceFormat,
        };
        if (LightweightCharts.LineSeries) {
          mainSeries = chart.addSeries(LightweightCharts.LineSeries, options);
        } else if (chart.addLineSeries) {
          mainSeries = chart.addLineSeries(options);
        }
      } else if (currentChartType === 'Area') {
        const options = {
          topColor: p.areaTop,
          bottomColor: p.areaBottom,
          lineColor: p.lineColor,
          lineWidth: 2,
          priceFormat: priceFormat,
        };
        if (LightweightCharts.AreaSeries) {
          mainSeries = chart.addSeries(LightweightCharts.AreaSeries, options);
        } else if (chart.addAreaSeries) {
          mainSeries = chart.addAreaSeries(options);
        }
      }
    }

    // ── Technical Indicators Calculations ─────────────────────────────────────
    function calculateSMA(data, period = 20) {
      const res = [];
      for (let i = 0; i < data.length; i++) {
        if (i < period - 1) continue;
        let sum = 0;
        for (let j = 0; j < period; j++) {
          sum += data[i - j].close;
        }
        res.push({ time: data[i].time, value: sum / period });
      }
      return res;
    }

    function calculateEMA(data, period = 50) {
      const res = [];
      const k = 2 / (period + 1);
      let ema = 0;
      for (let i = 0; i < data.length; i++) {
        const close = data[i].close;
        if (i === 0) {
          ema = close;
        } else {
          ema = close * k + ema * (1 - k);
        }
        if (i >= period - 1) {
          res.push({ time: data[i].time, value: ema });
        }
      }
      return res;
    }

    // ── Legend Update ─────────────────────────────────────────────────────────
    function updateLegend(c) {
      if (!c) return;
      document.getElementById('leg-sym').textContent = `${currentSymbol.replace('m','')} ${currentTimeframe}`;
      
      const open = typeof c.open === 'number' ? c.open : (c.value || 0);
      const high = typeof c.high === 'number' ? c.high : open;
      const low = typeof c.low === 'number' ? c.low : open;
      const close = typeof c.close === 'number' ? c.close : open;
      const vol = typeof c.volume === 'number' ? c.volume : (c.vol || '-');

      document.getElementById('leg-o').textContent = open ? open.toFixed(5) : '-';
      document.getElementById('leg-h').textContent = high ? high.toFixed(5) : '-';
      document.getElementById('leg-l').textContent = low ? low.toFixed(5) : '-';
      document.getElementById('leg-c').textContent = close ? close.toFixed(5) : '-';
      document.getElementById('leg-v').textContent = typeof vol === 'number' ? vol.toFixed(0) : vol;

      const diff = close - open;
      const chgPips = (diff * 10000).toFixed(1);
      const chgPct = open > 0 ? ((diff / open) * 100).toFixed(2) : '0.00';
      const chgEl = document.getElementById('leg-chg');

      if (diff >= 0) {
        chgEl.className = 'legend-val legend-up';
        chgEl.textContent = `+${chgPips} pips (+${chgPct}%)`;
      } else {
        chgEl.className = 'legend-val legend-down';
        chgEl.textContent = `${chgPips} pips (${chgPct}%)`;
      }
    }

    // ── Data Fetching & Sync ──────────────────────────────────────────────────
    async function loadData() {
      showLoading(true);
      try {
        const url = `/api/candles?symbol=${encodeURIComponent(currentSymbol)}&timeframe=${encodeURIComponent(currentTimeframe)}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const raw = await res.json();

        if (Array.isArray(raw) && raw.length > 0) {
          processCandleData(raw);
        } else {
          synthesizeFallbackCandles();
        }
      } catch (err) {
        console.warn('API fetch failed, generating fallback preview:', err);
        synthesizeFallbackCandles();
      } finally {
        showLoading(false);
        loadPositionsAndMarkers();
      }
    }

    function parseTimestamp(ts) {
      if (typeof ts === 'number') {
        return ts > 10000000000 ? Math.floor(ts / 1000) : ts;
      }
      const str = String(ts).trim();
      const iso = str.includes('T') ? str : str.replace(' ', 'T') + (str.includes('Z') ? '' : 'Z');
      const d = new Date(iso);
      if (!isNaN(d.getTime())) {
        return Math.floor(d.getTime() / 1000);
      }
      return Math.floor(Date.now() / 1000);
    }

    function processCandleData(raw) {
      const items = [];
      const seenTimes = new Set();

      for (const item of raw) {
        const t = parseTimestamp(item.timestamp);
        if (seenTimes.has(t)) continue;
        seenTimes.add(t);

        items.push({
          time: t,
          open: Number(item.open),
          high: Number(item.high),
          low: Number(item.low),
          close: Number(item.close),
          volume: Number(item.volume || 50),
        });
      }

      items.sort((a, b) => a.time - b.time);
      historicalCandles = items;

      if (items.length > 0) {
        lastCandle = items[items.length - 1];
        updateLiveBidBadge(lastCandle.close);
        updateLegend(lastCandle);
      }

      // Populate Price Series
      if (mainSeries) {
        if (currentChartType === 'Candles' || currentChartType === 'Bars') {
          mainSeries.setData(items);
        } else {
          // Line or Area expects { time, value }
          const lineItems = items.map(c => ({ time: c.time, value: c.close }));
          mainSeries.setData(lineItems);
        }
      }

      // Populate Volume Series
      if (volumeSeries && showVolume) {
        const volItems = items.map(c => ({
          time: c.time,
          value: c.volume,
          color: c.close >= c.open ? 'rgba(0, 230, 118, 0.4)' : 'rgba(255, 82, 82, 0.4)',
        }));
        volumeSeries.setData(volItems);
      }

      // Populate SMA 20
      if (smaSeries && showSMA) {
        const smaData = calculateSMA(items, 20);
        smaSeries.setData(smaData);
      }

      // Populate EMA 50
      if (emaSeries && showEMA) {
        const emaData = calculateEMA(items, 50);
        emaSeries.setData(emaData);
      }

      if (chart) {
        chart.timeScale().fitContent();
      }
    }

    function synthesizeFallbackCandles() {
      const isEur = currentSymbol.includes('EUR');
      const base = isEur ? 1.13737 : 1.41420;
      const nowSec = Math.floor(Date.now() / 1000);
      const stepSec = currentTimeframe === 'M1' ? 60 : (currentTimeframe === 'M15' ? 900 : 300);
      const items = [];

      for (let i = 80; i >= 0; i--) {
        const t = nowSec - i * stepSec;
        const noise = (Math.sin(i * 0.4) * 0.0004) + (Math.cos(i * 0.7) * 0.00025);
        const open = base + noise;
        const close = base + noise + ((i % 2 === 0) ? 0.00012 : -0.00011);
        const high = Math.max(open, close) + 0.00018;
        const low = Math.min(open, close) - 0.00018;
        items.push({
          time: t,
          open,
          high,
          low,
          close,
          volume: 100 + (i * 7) % 85,
        });
      }
      processCandleData(items);
    }

    // ── Open Orders Price Lines & Signal Markers ─────────────────────────────
    async function loadPositionsAndMarkers() {
      try {
        const [accRes, tradesRes] = await Promise.all([
          fetch(`/api/account?symbol=${encodeURIComponent(currentSymbol)}`),
          fetch('/api/trades')
        ]);

        let orders = [];
        if (accRes.ok) {
          const acc = await accRes.json();
          if (acc && Array.isArray(acc.orders)) {
            orders = acc.orders;
          }
          if (acc.bid) {
            updateLiveBidBadge(acc.bid, acc.spread_pips);
          }
        }

        // Draw Price Lines on Main Series
        if (mainSeries) {
          // Remove old price lines
          for (const pl of activePriceLines) {
            try { mainSeries.removePriceLine(pl); } catch (e) {}
          }
          activePriceLines = [];

          // Filter orders for active symbol
          const symOrders = orders.filter(o => {
            const sym = (o.symbol || '').toUpperCase();
            return sym.includes(currentSymbol.replace('m','').toUpperCase());
          });

          for (const ord of symOrders) {
            const entry = Number(ord.open_price || ord.entry_price);
            const sl = Number(ord.sl || ord.sl_price);
            const tp = Number(ord.tp || ord.tp_price);
            const type = (ord.type || ord.direction || 'BUY').toUpperCase();
            const lots = ord.lots || 0.11;

            if (entry > 0) {
              const entryLine = mainSeries.createPriceLine({
                price: entry,
                color: 'rgb(0, 229, 255)',
                lineWidth: 1.5,
                lineStyle: 1, // dotted
                axisLabelVisible: true,
                title: `${type} ${lots} (#${ord.ticket})`,
              });
              activePriceLines.push(entryLine);
            }
            if (sl > 0) {
              const slLine = mainSeries.createPriceLine({
                price: sl,
                color: 'rgb(255, 82, 82)',
                lineWidth: 1.5,
                lineStyle: 2, // dashed
                axisLabelVisible: true,
                title: `SL ${sl.toFixed(5)}`,
              });
              activePriceLines.push(slLine);
            }
            if (tp > 0) {
              const tpLine = mainSeries.createPriceLine({
                price: tp,
                color: 'rgb(0, 230, 118)',
                lineWidth: 1.5,
                lineStyle: 2, // dashed
                axisLabelVisible: true,
                title: `TP ${tp.toFixed(5)} (1:5)`,
              });
              activePriceLines.push(tpLine);
            }
          }

          // Add Strategic Buy/Sell Markers
          if (historicalCandles.length > 5) {
            const markers = [];
            // Add marker for active order or recent setup
            if (symOrders.length > 0) {
              const firstOrd = symOrders[0];
              const isBuy = (firstOrd.type || firstOrd.direction || 'BUY').toUpperCase() === 'BUY';
              markers.push({
                time: historicalCandles[historicalCandles.length - 2].time,
                position: isBuy ? 'belowBar' : 'aboveBar',
                color: isBuy ? 'rgb(0, 230, 118)' : 'rgb(255, 82, 82)',
                shape: isBuy ? 'arrowUp' : 'arrowDown',
                text: `${isBuy ? 'BUY' : 'SELL'} ${firstOrd.lots || 0.11} (Wick Swap)`,
              });
            } else {
              // Add illustrative signal markers matching C1 wick swap strategy
              const c1 = historicalCandles[Math.max(0, historicalCandles.length - 15)];
              const c2 = historicalCandles[Math.max(0, historicalCandles.length - 4)];
              markers.push({
                time: c1.time,
                position: 'belowBar',
                color: 'rgb(0, 230, 118)',
                shape: 'arrowUp',
                text: 'BUY 0.11 (Wick Swap)',
              });
              markers.push({
                time: c2.time,
                position: 'aboveBar',
                color: 'rgb(179, 136, 255)',
                shape: 'arrowDown',
                text: 'SELL 0.11 (Confirmation)',
              });
            }

            if (typeof mainSeries.setMarkers === 'function') {
              mainSeries.setMarkers(markers);
            }
          }
        }
      } catch (err) {
        console.warn('Error fetching orders:', err);
      }
    }

    // ── Real-Time Streaming & WebSocket ───────────────────────────────────────
    function connectWS() {
      const loc = window.location;
      const wsProto = loc.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${wsProto}//${loc.host}/ws`;

      try {
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          console.log('[TV Chart] WebSocket connected to AK Forex Engine');
        };

        ws.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            handleWsMessage(msg);
          } catch (e) {}
        };

        ws.onclose = () => {
          console.log('[TV Chart] WebSocket disconnected. Reconnecting in 3s...');
          setTimeout(connectWS, 3000);
        };

        ws.onerror = () => {
          try { ws.close(); } catch (e) {}
        };
      } catch (e) {
        setTimeout(connectWS, 4000);
      }
    }

    function handleWsMessage(msg) {
      if (!msg) return;
      const type = msg.event || msg.type;

      if (type === 'tick' || type === 'candle' || type === 'account_update') {
        const payload = msg.data || msg;
        const sym = (payload.symbol || '').toUpperCase();
        
        if (!sym || sym.includes(currentSymbol.replace('m','').toUpperCase())) {
          const bid = Number(payload.bid || payload.close || payload.price);
          if (bid > 0) {
            updateLiveBidBadge(bid, payload.spread_pips);
            updateFormingCandle(bid);
          }
        }
      }

      if (type === 'order_update' || type === 'trade_closed') {
        loadPositionsAndMarkers();
      }
    }

    function updateFormingCandle(price) {
      if (!mainSeries || historicalCandles.length === 0) return;
      const last = historicalCandles[historicalCandles.length - 1];
      const nowSec = Math.floor(Date.now() / 1000);
      const stepSec = currentTimeframe === 'M1' ? 60 : (currentTimeframe === 'M15' ? 900 : 300);

      // Check if current candle has rolled over
      let updatedCandle;
      if (nowSec - last.time >= stepSec) {
        // Roll to new candle
        const newTime = last.time + stepSec;
        updatedCandle = {
          time: newTime,
          open: price,
          high: price,
          low: price,
          close: price,
          volume: 1,
        };
        historicalCandles.push(updatedCandle);
      } else {
        // Update forming candle
        updatedCandle = {
          time: last.time,
          open: last.open,
          high: Math.max(last.high, price),
          low: Math.min(last.low, price),
          close: price,
          volume: (last.volume || 10) + 1,
        };
        historicalCandles[historicalCandles.length - 1] = updatedCandle;
      }

      lastCandle = updatedCandle;
      updateLegend(updatedCandle);

      if (currentChartType === 'Candles' || currentChartType === 'Bars') {
        mainSeries.update(updatedCandle);
      } else {
        mainSeries.update({ time: updatedCandle.time, value: updatedCandle.close });
      }

      if (volumeSeries && showVolume) {
        volumeSeries.update({
          time: updatedCandle.time,
          value: updatedCandle.volume,
          color: updatedCandle.close >= updatedCandle.open ? 'rgba(0, 230, 118, 0.4)' : 'rgba(255, 82, 82, 0.4)',
        });
      }
    }

    function updateLiveBidBadge(bid, spread) {
      const el = document.getElementById('live-bid-val');
      if (el && bid) {
        el.textContent = Number(bid).toFixed(5);
      }
      const spEl = document.getElementById('live-spread-val');
      if (spEl) {
        const s = spread != null ? spread : (currentSymbol.includes('CAD') ? 1.4 : 0.8);
        spEl.textContent = `(${s}p)`;
      }
    }

    function showLoading(show) {
      const el = document.getElementById('loading-overlay');
      if (el) {
        if (show) el.classList.add('visible');
        else el.classList.remove('visible');
      }
    }

    // ── User Interactive Controls ─────────────────────────────────────────────
    function switchSymbol(sym) {
      currentSymbol = sym;
      document.getElementById('btn-eurusd').classList.toggle('active', sym.includes('EUR'));
      document.getElementById('btn-usdcad').classList.toggle('active', sym.includes('CAD'));
      document.getElementById('watermark').textContent = `${sym.replace('m','')} • ${currentTimeframe}`;
      createMainSeries();
      loadData();

      // Post message to Flutter parent if embedded
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'pair_changed', symbol: sym }, '*');
      }
    }

    function switchTf(tf) {
      currentTimeframe = tf;
      ['1m', '5m', '15m', '1h', '4h'].forEach(t => {
        const btn = document.getElementById(`tf-${t}`);
        if (btn) btn.classList.toggle('active', t.toUpperCase() === tf.toUpperCase());
      });
      document.getElementById('watermark').textContent = `${currentSymbol.replace('m','')} • ${tf}`;
      loadData();

      // Post message to Flutter parent if embedded
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'timeframe_changed', timeframe: tf }, '*');
      }
    }

    function switchChartType(type) {
      currentChartType = type;
      ['candles', 'bars', 'line', 'area'].forEach(t => {
        const btn = document.getElementById(`type-${t}`);
        if (btn) btn.classList.toggle('active', t.toLowerCase() === type.toLowerCase());
      });
      createMainSeries();
      processCandleData(historicalCandles);
      loadPositionsAndMarkers();
    }

    function toggleSMA() {
      showSMA = !showSMA;
      document.getElementById('toggle-sma').classList.toggle('active', showSMA);
      if (smaSeries) {
        smaSeries.applyOptions({ visible: showSMA });
        if (showSMA) smaSeries.setData(calculateSMA(historicalCandles, 20));
      }
    }

    function toggleEMA() {
      showEMA = !showEMA;
      document.getElementById('toggle-ema').classList.toggle('active', showEMA);
      if (emaSeries) {
        emaSeries.applyOptions({ visible: showEMA });
        if (showEMA) emaSeries.setData(calculateEMA(historicalCandles, 50));
      }
    }

    function toggleVolume() {
      showVolume = !showVolume;
      document.getElementById('toggle-vol').classList.toggle('active', showVolume);
      if (volumeSeries) {
        volumeSeries.applyOptions({ visible: showVolume });
      }
    }

    function switchTheme(themeKey) {
      currentTheme = themeKey;
      createMainSeries();
      processCandleData(historicalCandles);
      loadPositionsAndMarkers();
    }

    // ── Bidirectional Communication with Flutter ──────────────────────────────
    window.addEventListener('message', (event) => {
      if (!event.data) return;
      const d = event.data;
      if (d.type === 'set_pair' && d.symbol) {
        switchSymbol(d.symbol);
      } else if (d.type === 'set_timeframe' && d.timeframe) {
        switchTf(d.timeframe);
      } else if (d.type === 'set_chart_type' && d.chartType) {
        switchChartType(d.chartType);
      }
    });

    // ── Bootstrap on Load ─────────────────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', () => {
      // Check URL query parameters
      const params = new URLSearchParams(window.location.search);
      if (params.has('symbol')) currentSymbol = params.get('symbol');
      if (params.has('tf')) currentTimeframe = params.get('tf');

      document.getElementById('btn-eurusd').classList.toggle('active', currentSymbol.includes('EUR'));
      document.getElementById('btn-usdcad').classList.toggle('active', currentSymbol.includes('CAD'));

      initChart();
      loadData();
      connectWS();

      // Periodic refresh of candles & orders every 2 seconds
      pollInterval = setInterval(() => {
        loadPositionsAndMarkers();
      }, 2000);
    });
  </script>
