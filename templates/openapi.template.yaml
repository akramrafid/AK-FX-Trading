openapi: 3.1.0
info:
  title: "{{PROJECT_NAME}} API"
  version: 0.1.0
  description: Generated in Phase 2 by senior-technical-writer. Do not document unbuilt endpoints as live.
servers:
  - url: http://localhost:8000
    description: Local
paths:
  /health/live:
    get:
      operationId: healthLive
      summary: Liveness probe
      responses:
        "200":
          description: Process is alive
  /health/ready:
    get:
      operationId: healthReady
      summary: Readiness probe (dependencies reachable)
      responses:
        "200":
          description: Ready
        "503":
          description: Dependency unavailable
components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, trace_id]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
            trace_id: { type: string }
